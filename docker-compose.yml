version: '3.8'

services:
  metadata-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: conva_user
      POSTGRES_PASSWORD: conva_password
      POSTGRES_DB: conva_metadata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
