[project]
name = "conva"
version = "0.1.0"
description = "ConvA — Conversational Analytics Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "langgraph>=0.0.25",
    "langchain-core>=0.1.20",
    "duckdb>=0.10.0",
    "polars>=0.20.10",
    "scipy>=1.12.0",
    "statsmodels>=0.14.1",
    "scikit-learn>=1.4.0",
    "spacy>=3.7.4",
    "transformers>=4.37.0",
    "pyarrow>=15.0.0",
    "langchain-openai>=0.0.8",
    "langchain-anthropic>=0.1.4",
    "pyjwt>=2.8.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
